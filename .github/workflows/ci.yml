name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Unit & backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Reject vulnerable production dependencies
        run: npm run audit:production

      - run: npm run test -- --reporter=verbose

  e2e:
    name: Read-only production smoke
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run read-only smoke tests against production
        run: npx playwright test .qa/production-smoke.spec.ts --project=chromium
        env:
          PLAYWRIGHT_BASE_URL: https://www.jamesroman.la

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
