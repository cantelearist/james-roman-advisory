name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Unit & backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run test -- --reporter=verbose
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  e2e:
    name: E2E user journeys
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Resolve browser-test target
        id: target
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== "pull_request") {
              core.setOutput("url", "https://www.jamesroman.la");
              return;
            }

            for (let attempt = 0; attempt < 30; attempt += 1) {
              const { data: commitStatus } = await github.rest.repos.getCombinedStatusForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.sha,
              });
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              });
              const preview = comments
                .filter((comment) => comment.user?.login === "vercel[bot]")
                .reverse()
                .map((comment) => comment.body?.match(/\[Preview\]\((https:\/\/[^)]+)\)/)?.[1])
                .find(Boolean);
              const vercelReady = commitStatus.statuses.some(
                (status) => status.context === "Vercel" && status.state === "success",
              );

              if (preview && vercelReady) {
                core.setOutput("url", preview);
                return;
              }

              await new Promise((resolve) => setTimeout(resolve, 10_000));
            }

            core.setFailed("Vercel preview URL was not available after five minutes.");

      - name: Run E2E tests against the deployed commit
        run: npx playwright test --project=chromium
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.target.outputs.url }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
