name: Disposable database access integration

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to test
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: disposable-database-access-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  access-matrix:
    name: Access matrix and RLS readiness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_BRANCH_NAME: test/jra-access-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set short branch expiry
        id: expiry
        run: echo "expires_at=$(date -u --date '+2 hours' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Create schema-only Neon branch
        id: create-branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ${{ env.TEST_BRANCH_NAME }}
          branch_type: schema-only
          expires_at: ${{ steps.expiry.outputs.expires_at }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Apply versioned schema migrations
        run: npm run db:migrate:disposable
        env:
          ALLOW_DATABASE_INTEGRATION: "true"
          INTEGRATION_DATABASE_URL: ${{ steps.create-branch.outputs.db_url_pooled }}
          INTEGRATION_NEON_BRANCH_ID: ${{ steps.create-branch.outputs.branch_id }}
          INTEGRATION_NEON_BRANCH_NAME: ${{ env.TEST_BRANCH_NAME }}
          INTEGRATION_NEON_ENDPOINT_HOST: ${{ steps.create-branch.outputs.db_host_pooled }}
          INTEGRATION_NEON_EXPIRES_AT: ${{ steps.expiry.outputs.expires_at }}
          INTEGRATION_NEON_BRANCH_TYPE: schema-only

      - name: Run database-backed access and RLS readiness suites
        run: npm run test:integration:database
        env:
          ALLOW_DATABASE_INTEGRATION: "true"
          INTEGRATION_DATABASE_URL: ${{ steps.create-branch.outputs.db_url_pooled }}
          INTEGRATION_NEON_BRANCH_ID: ${{ steps.create-branch.outputs.branch_id }}
          INTEGRATION_NEON_BRANCH_NAME: ${{ env.TEST_BRANCH_NAME }}
          INTEGRATION_NEON_ENDPOINT_HOST: ${{ steps.create-branch.outputs.db_host_pooled }}
          INTEGRATION_NEON_EXPIRES_AT: ${{ steps.expiry.outputs.expires_at }}
          INTEGRATION_NEON_BRANCH_TYPE: schema-only

      - name: Delete disposable Neon branch
        if: ${{ always() && steps.create-branch.outputs.branch_id != '' }}
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ steps.create-branch.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
